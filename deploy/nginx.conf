# Install in nginx's http context (e.g. /etc/nginx/conf.d/theworldmigration.conf).
# Replace example.com, certificate paths and root; copy security-headers.conf to /etc/nginx/snippets/.
# This example assumes ONE local reverse proxy, with no CDN in front.
log_format expert_safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=expert_edge:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name example.com;
    return 308 https://example.com$request_uri;
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/expert4visas-frontend/dist;
    index index.html;
    autoindex off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/theworldmigration-access.log expert_safe;
    include /etc/nginx/snippets/security-headers.conf;

    location ~ /\. { deny all; }
    location ~* \.(db|sqlite|sqlite3|log|py|zip|env|map)$ { deny all; }
    location /api/ {
        limit_req zone=expert_edge burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_cache off;
        proxy_hide_header Server;
    }
    location = /admin.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
